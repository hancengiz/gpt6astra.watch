name = "gpt6astra-watch"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"

# D1 — create once with:
#   npx wrangler d1 create astra-watch
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "astra-watch"
database_id = "d836f510-3a99-4251-901c-7022afad5568"

# The only secret (salt for IP hashing) is set out-of-band, never committed:
#   npx wrangler pages secret put IP_HASH_SECRET
